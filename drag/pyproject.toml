[tool.setuptools.package-data]
tuner = ["py.typed"]

[tool.setuptools]
packages = ["drag"]

[project]
name = "drag"
# authors = []
description = "Dynamic RAG"
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "dynamic",
    "rag",
]
# license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
version = "0.0.0"
dependencies = [
    "xformers",
    "loguru",
]

[project.optional-dependencies]
dev = [
    # Development tools.
    "black",
    "flake8",
    "isort",
    "mypy",
    "pytest",
    "pytest-cov",

    # Benchmarks.
    "huggingface_hub",
    "simple_parsing",
    "numpy",
    "transformers",
]


[[tool.mypy.overrides]]
module = "vllm.*"
ignore_errors = true