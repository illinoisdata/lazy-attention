[tool.setuptools.package-data]
tuner = ["py.typed"]

[tool.setuptools]
packages = ["minidrag"]

[project]
name = "minidrag"
# authors = []
description = "Dynamic RAG"
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "dynamic",
    "rag",
]
# license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
version = "0.0.0"
dependencies = [
    # Requirement
    "huggingface_hub",
    "loguru",
    "numpy",
    "simple_parsing",
    # "xformers",

    # Baseline requirements
    "accelerate",
    "astor",
    "bitsandbytes",
    "datasets",
    "fire",
    "fuzzywuzzy",
    "jieba",
    "lxml",
    "python-Levenshtein",
    "Requests",
    "rouge",
    "termcolor",
    "torch",
    "tqdm",
    "transformers",
]

[project.optional-dependencies]
dev = [
    # Development
    "black",
    "flake8",
    "isort",
    "mypy",
    "pytest",
    "pytest-xdist",
    "pytest-cov",
    "pytest-rerunfailures",
]


[[tool.mypy.overrides]]
module = "vllm.*"
ignore_errors = true
