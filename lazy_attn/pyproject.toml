[tool.setuptools.package-data]
tuner = ["py.typed"]

[tool.setuptools]
packages = ["lazy"]

[project]
name = "lazy"
# authors = []
description = "Dynamic RAG"
readme = "README.md"
requires-python = ">=3.9"
keywords = [
    "dynamic",
    "rag",
]
# license = {file = "LICENSE"}
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
version = "0.0.0"
# The `lazy` package is a monkey-patch layer over vLLM: everything it imports
# (torch, triton, transformers, numpy, msgspec, zmq, xgrammar, ...) already
# comes with vLLM itself, so pinning them here only risks fighting vLLM's own
# pins. vLLM is deliberately NOT listed: it must be installed with a matching
# torch build (see scripts/install.sh), which a plain dependency cannot express.
dependencies = [
    "matplotlib",  # lazy/utils/monitoring.py
]

[project.optional-dependencies]
dev = [
    "black",
    "flake8",
    "isort",
    "mypy",
    "pytest",
    "pytest-xdist",
    "pytest-cov",
    "pytest-rerunfailures",
]
# Everything the benchmarks in ../benchmarks need on top of the library.
bench = [
    "datasets",
    "fastapi",
    "fuzzywuzzy",
    "jieba",
    "loguru",
    "pandas",
    "pydantic",
    "python-Levenshtein",
    "requests",
    "rouge",
    "scipy",
    "simple_parsing",
    "uvicorn",
]


[[tool.mypy.overrides]]
module = "vllm.*"
ignore_errors = true
